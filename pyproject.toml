[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-pl"
dynamic = ["version"]
description = "Keyboard-driven terminal music player with spectrum visualizer, synced lyrics and online streaming"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "mutagen>=1.47",
    "yt-dlp>=2024.1.0",
    "pyacoustid>=1.3",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
termuxpl = "termuxpl.app:main"

[tool.setuptools]
packages = ["termuxpl"]

[tool.setuptools.dynamic]
version = { attr = "termuxpl.__version__" }

[tool.setuptools.package-data]
termuxpl = ["*.tcss", "*.md"]

[project.urls]
Homepage = "https://github.com/mrvirus5639-art/termux-pl"
Changelog = "https://github.com/mrvirus5639-art/termux-pl/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
