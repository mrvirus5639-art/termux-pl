name: Release

# Runs when you push a tag like v1.2.0 (scripts/release.py creates these).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('termuxpl/__init__.py').read()).group(1))")
          echo "tag=$TAG code=$CODE"
          test "$TAG" = "$CODE" || { echo "::error::Tag v$TAG does not match __version__ $CODE"; exit 1; }

      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build wheel, sdist and Windows zip
        run: |
          python -m pip install build
          python -m build
          NAME="TermuxPL-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="$NAME/" -o "dist/$NAME.zip" "$GITHUB_REF_NAME"
          ls -l dist

      - name: Release notes from CHANGELOG
        run: python scripts/release.py notes "${GITHUB_REF_NAME}" > notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Termux PL $GITHUB_REF_NAME" \
            --notes-file notes.md
